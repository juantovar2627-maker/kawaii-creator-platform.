name: Mimi checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: mimi-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mimi_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d mimi_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: development
      POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/mimi_ci
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/mimi_ci
      BASE_URL: http://127.0.0.1:3000
      TEST_BASE_URL: http://127.0.0.1:3000
      PAYMENTS_ENABLED: "false"
      MEDIA_STORAGE_DRIVER: local
      MEDIA_SCAN_MODE: development-manual
      VIDEO_SANDBOX_MODE: development-prlimit
      NODE_USE_SYSTEM_CA: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Prepare synthetic runtime
        shell: bash
        run: |
          set -euo pipefail
          auth_secret="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "$auth_secret"
          printf 'AUTH_SECRET=%s\n' "$auth_secret" >> "$GITHUB_ENV"
          printf 'MEDIA_LOCAL_ROOT=%s\nVIDEO_WORK_ROOT=%s\n' "$RUNNER_TEMP/mimi-media" "$RUNNER_TEMP/mimi-video-work" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg bubblewrap util-linux openssl
          ffmpeg -version | head -n 1
      - run: pnpm install --frozen-lockfile
      - name: Prepare a separate synthetic staging database with verified TLS
        env:
          CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: node scripts/prepare-ci-staging.mjs
      - name: Reject high and critical dependency advisories
        run: pnpm audit --audit-level high
      - name: Validate runtime settings
        run: pnpm config:check
      - name: Apply migrations twice to disposable PostgreSQL
        run: |
          pnpm db:migrate
          pnpm db:migrate
          node scripts/test-staging.mjs --migrate
          node scripts/test-staging.mjs --migrate
          node scripts/test-staging-role.mjs
      - run: pnpm typecheck
      - run: pnpm build
      - name: Start loopback application
        shell: bash
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/mimi-server.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent "$TEST_BASE_URL/api/health" > /dev/null; then exit 0; fi
            sleep 1
          done
          echo 'Application failed its availability check.'
          exit 1
      - name: Start private staging test runtime
        shell: bash
        run: |
          node scripts/test-staging.mjs > "$RUNNER_TEMP/mimi-staging-server.log" 2>&1 &
          for attempt in {1..30}; do
            if [ "$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'X-Forwarded-Proto: https' "$TEST_STAGING_BASE_URL/api/health")" = 401 ]; then exit 0; fi
            sleep 1
          done
          echo 'Staging runtime failed its expected access-denial check.'
          exit 1
      - name: Full unit and PostgreSQL/media/payment regression suite
        run: node scripts/ci-run.mjs node --test --test-concurrency=1 tests/*.test.mjs
      - name: Install Chromium for browser checks
        run: pnpm exec playwright install --with-deps chromium
      - name: Authentication, demo, mobile and private staging browser checks
        env:
          TEST_ARTIFACT_DIR: ${{ runner.temp }}/mimi-browser
        run: node scripts/ci-run.mjs pnpm test:browser
      - name: Prepare isolated synthetic staging smoke accounts
        run: node scripts/prepare-staging-smoke.mjs
      - name: Start loopback synthetic staging ingress for browser smoke
        env:
          STAGING_SMOKE_FIXTURE: "true"
        run: |
          node scripts/staging-smoke-proxy.mjs > "$RUNNER_TEMP/mimi-smoke-proxy.log" 2>&1 &
          for attempt in {1..20}; do
            if [ "$(curl --silent --output /dev/null --write-out '%{http_code}' "$STAGING_SMOKE_ALLOWED_ORIGIN/api/health")" = 401 ]; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Real text-only private staging smoke and accessibility
        env:
          STAGING_SMOKE_FIXTURE: "true"
        run: node scripts/ci-run.mjs node scripts/staging-smoke.cjs
      - name: Build the deployment container without runtime secrets
        run: docker build --tag mimi:ci .
      - name: Check non-root runtime and native Sharp
        run: |
          docker run --rm --entrypoint node mimi:ci -e 'if(process.getuid()===0)process.exit(1);require("sharp")({create:{width:1,height:1,channels:3,background:"pink"}}).webp().toBuffer().then(b=>{if(!b.length)process.exit(1)})'
      - name: Report bounded server status on failure
        if: failure()
        run: |
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          import {join} from 'node:path';
          for(const name of ['mimi-server.log','mimi-staging-server.log']) {
            const text=await readFile(join(process.env.RUNNER_TEMP,name),'utf8').catch(()=> '');
            console.log(JSON.stringify({service:name,logPresent:!!text,readySeen:/Ready in/.test(text),configurationRejected:/Invalid runtime configuration|database security verification failed/.test(text)}));
          }
          JS
